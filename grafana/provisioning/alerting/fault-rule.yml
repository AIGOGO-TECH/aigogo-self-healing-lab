# Grafana alert rule, provisioned as a file so that a fresh clone gets it.
#
# What it does: count Salt beacon fault events in the last 120 seconds,
# grouped by device / fault / interface, and fire when that count is > 0.
# Evaluated every 10s with for:10s, so a fault reaches n8n roughly 20
# seconds after the beacon first saw it.
#
# Grafana is only the wake-up call. The alert carries device, fault and
# interface as annotations, but n8n re-queries Elasticsearch for the full
# fault record rather than trusting the notification payload -- Grafana's
# templating rendered "[no value]" for anything it could not resolve.
# See docs/lessons.md.
apiVersion: 1

groups:
  - orgId: 1
    name: selfheal
    folder: selfheal
    interval: 10s
    rules:
      - uid: selfheal-fault-rule
        title: Network fault detected by Salt beacon
        condition: C
        for: 10s
        # OK, not Alerting: no events in the window means no fault, which is
        # the normal state of a healthy lab. NoData must not page anyone.
        noDataState: OK
        # Error, not OK. With execErrState: OK this rule spent an entire
        # outage reporting health "ok" and state "inactive" while every
        # query it made came back 401 Unauthorized. A detector that cannot
        # see must say so. Grafana raises this as alertname=DatasourceError,
        # which policies.yml routes to a human rather than to the
        # remediation webhook -- a broken detector must never be able to
        # trigger an automated config push.
        execErrState: Error
        isPaused: false
        annotations:
          summary: A Salt beacon reported a network fault
          device: '{{ index $labels "data.device.keyword" }}'
          fault: '{{ index $labels "data.fault.keyword" }}'
          interface: '{{ index $labels "data.interface.keyword" }}'
          detail: '{{ index $labels "data.device.keyword" }} {{ index $labels "data.fault.keyword" }} {{ index $labels "data.interface.keyword" }}'
        labels: {}
        data:
          - refId: A
            datasourceUid: es-napalm
            relativeTimeRange: { from: 120, to: 0 }
            model:
              refId: A
              datasource: { type: elasticsearch, uid: es-napalm }
              query: 'tag:*fault*'
              timeField: data._stamp
              alias: ''
              intervalMs: 1000
              maxDataPoints: 43200
              metrics:
                - { id: '1', type: count }
              bucketAggs:
                - id: '3'
                  type: terms
                  field: data.device.keyword
                  settings: { min_doc_count: '1', order: desc, orderBy: _term, size: '10' }
                - id: '4'
                  type: terms
                  field: data.fault.keyword
                  settings: { min_doc_count: '1', order: desc, orderBy: _term, size: '10' }
                - id: '5'
                  type: terms
                  field: data.interface.keyword
                  settings: { min_doc_count: '1', order: desc, orderBy: _term, size: '10' }
                - id: '2'
                  type: date_histogram
                  field: data._stamp
                  settings: { interval: 1m, min_doc_count: '1', trimEdges: '0' }
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              refId: B
              type: reduce
              reducer: max
              expression: A
              # dropNN, not replaceNN: a series with no data in the window is
              # a device that is fine, and must not be reduced to a 0 that
              # then evaluates against the threshold.
              settings: { mode: dropNN }
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
              intervalMs: 1000
              maxDataPoints: 43200
