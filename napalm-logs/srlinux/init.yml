# napalm-logs profile: Nokia SR Linux
#
# napalm-logs ships profiles for eos, fortinet, huawei, ios, iosxr, junos,
# netiron, nxos, opengear and sonic. There is none for SR Linux. This is one.
#
# SR Linux emits RFC 5424 and then carries a SECOND, SR Linux-specific header
# inside the message body. A real datagram, captured off the wire:
#
#   <182>1 2026-09-30T03:43:36.552123+00:00 srl3 sr_net_inst_mgr 2495 - - netinst|2495|2495|00042|W: The interface ethernet-1/1.0 ...
#    ^pri ^v ^timestamp                     ^host ^APP-NAME      ^pid ^mid ^sd ^subsystem ^pid ^tid ^seq ^sev  ^text
#
# Two things about that line are easy to get wrong, and neither shows up
# when a reconstructed sample is replayed through the parser -- only when
# the daemon is pointed at live routers.
#
# 1. The RFC 5424 APP-NAME is the PROCESS -- sr_net_inst_mgr, sr_bgp_mgr,
#    sr_isis_mgr, sr_bfd_mgr, sr_lldp_mgr, sr_mgmt_server. It is NOT the
#    subsystem name. The subsystem -- netinst, bgp, isis, bfd, lldp, mgmt --
#    appears only in the inner header.
#
#    napalm-logs matches every message file on `tag`, and the subsystem is
#    what actually distinguishes one message type from another, so `tag` is
#    bound to the INNER name and the process name is captured and discarded.
#    Binding it the other way round means each message file keys on a process
#    name, which tells you which binary logged rather than what happened.
#
# 2. There is exactly ONE space between the structured-data "-" and the inner
#    header, not two. A prefix that expects two matches nothing at all, and
#    napalm-logs reports the outer APP-NAME as an unconfigured tag -- which
#    reads like a missing message file rather than a broken prefix.
#
# Every `line` and `values` in this directory is written against messages
# captured from real routers. The raw sample is quoted above each one.

prefixes:
  - time_format: "%Y-%m-%dT%H:%M:%S.%f%z"
    values:
      version: (\d)
      date: (\d{4}\-\d{2}\-\d{2})
      time: (\d{2}:\d{2}:\d{2})
      timeSecfrac: (\d+)
      timeOffset: ((?:\+|\-)\d{2}:\d{2})
      host: ([^ ]+)
      # The RFC 5424 APP-NAME: the SR Linux process. Captured so the prefix
      # matches, then discarded -- see note 1 above.
      processName: ([^ ]+)
      processId: ([^ ]+)
      messageId: ([^ ]+)
      structuredData: ([^ ]+)
      # The inner header. `tag` is the subsystem, and it is what every
      # message file in this directory matches on.
      tag: (\w+)
      srlPid: (\d+)
      srlTid: (\d+)
      srlSeq: (\d+)
      severity_label: (\w)
    line: '{version} {date}T{time}.{timeSecfrac}{timeOffset} {host} {processName} {processId} {messageId} {structuredData} {tag}|{srlPid}|{srlTid}|{srlSeq}|{severity_label}: '
