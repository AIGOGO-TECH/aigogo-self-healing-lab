# netinst|2502|2502|00049|N: The interface ethernet-1/1.0 in
# network-instance default is now up

messages:
  - error: INTERFACE_UP
    tag: netinst
    values:
      interface: ([\w\-\/\.]+)
      network_instance: ([\w\-]+)
    line: 'The interface {interface} in network-instance {network_instance} is now up'
    model: openconfig-interfaces
    mapping:
      variables: {}
      static:
        interfaces//interface//{interface}//state//oper_status: UP
