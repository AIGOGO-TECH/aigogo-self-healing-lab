# salt-api — the only door n8n (and therefore the LLM) has into Salt.
#
# Deliberately narrow: the sharedsecret eauth user below may run exactly
# one function, state.apply, and only on srl* minions. It cannot run
# arbitrary commands, cannot reach the master's own runners, and cannot
# push raw config — state.apply can only execute a state file that
# already exists in salt/states/. An LLM that invents a state name gets
# a failed job, not a reconfigured router.
# Salt 3006+ disables every netapi client by default — you must name the
# ones you want. Only 'local' is enabled here: n8n can ask a minion to run
# a state, and cannot touch runners or the wheel (key management) at all.
netapi_enable_clients:
  - local

rest_cherrypy:
  port: 8000
  host: 0.0.0.0
  disable_ssl: True
  collect_stats: False

external_auth:
  sharedsecret:
    n8n:
      # Named one at a time, deliberately. This was 'srl*', which was true
      # of every device the automation managed right up until the topology
      # grew an upstream provider -- and then it silently covered that too.
      # srl4 has no proxy-minion, so nothing happened; the boundary was
      # held by an absence rather than by a rule, and an absence is not a
      # control. Adding a device to this list is the act of deciding that
      # automation may write to it, and it should look like a decision.
      - 'srl1':
          - 'state.apply'
      - 'srl2':
          - 'state.apply'
      - 'srl3':
          - 'state.apply'

# Rendered from ${SALT_API_SECRET} by salt/entrypoint.py at container
# start. The value never exists in this repo, only in .env.
sharedsecret: ${SALT_API_SECRET}
