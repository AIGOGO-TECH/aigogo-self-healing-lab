# P4: drift beacon -> reactor -> converge back to whichever source of
# truth the firing beacon points at. One glob covers both beacon names
# (config_drift = NetBox-backed, config_drift_pillar = pillar-backed) —
# heal_drift.sls reads which state to apply from the event data itself.
reactor:
  - 'salt/beacon/*/config_drift*/drift':
      - salt://reactor/heal_drift.sls
