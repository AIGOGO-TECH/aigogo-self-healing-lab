# All master-side events (job starts, returns, beacon fires) go to a single
# dated index Kibana matches with the "napalm-*" pattern. Job-return indices
# alone (salt-<function>) would fragment into one index per function.
#
# NOTE: the returner options (master_event_index, index_date, username ...)
# must be nested under this same 'elasticsearch' key, not set as separate
# top-level master config keys -- salt.returners.get_returner_options()
# resolves them via config.option("elasticsearch.<attr>"), a dotted lookup
# into this dict. Setting them at the top level looks right and does nothing.
event_return: elasticsearch

elasticsearch:
  hosts:
    - "${ES_URL}"
  # salt_writer may create and write napalm-2* and append to napalm-audit.
  # It cannot read the remediation history, and it cannot delete anything.
  username: ${SALT_ES_USER}
  password: ${SALT_ES_PASSWORD}
  master_event_index: napalm
  index_date: True
  debug_returner_payload: False
